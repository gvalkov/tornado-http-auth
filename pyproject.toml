[project]
name = "tornado-http-auth"
version = "1.1.1"
description = "Digest and basic authentication for tornado"
readme = "README.rst"
license = "Apache-2.0"
authors = [{ name = "Georgi Valkov", email = "georgi.t.valkov@gmail.com" }]
keywords = ["tornado", "digest-auth", "basic-auth"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
requires-python = ">=3.9"
dependencies = ["tornado>=4.0.0"]

[project.urls]
Homepage = "https://github.com/gvalkov/tornado-http-auth"
Repository = "https://github.com/gvalkov/tornado-http-auth"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E401"]
